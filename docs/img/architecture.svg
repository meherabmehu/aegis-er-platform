<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#0e1f36"/>
    </linearGradient>
    <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13d1ff"/>
      <stop offset="1" stop-color="#0a8ec4"/>
    </linearGradient>
    <linearGradient id="solv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ef0a5"/>
      <stop offset="1" stop-color="#14a06b"/>
    </linearGradient>
    <linearGradient id="ws" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b57dff"/>
      <stop offset="1" stop-color="#6e3fcf"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcd3c"/>
      <stop offset="1" stop-color="#d08a00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fe4ff"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 800; fill: #eaf6ff; letter-spacing: 1px; }
      .subtitle { font-size: 13px; fill: #7a9bbf; letter-spacing: 2px; text-transform: uppercase; }
      .boxTitle { font-size: 14px; font-weight: 700; fill: #fff; }
      .boxText { font-size: 11px; fill: #cfe3f7; }
      .label { font-size: 11px; fill: #9fd6ff; font-weight: 600; }
      .small { font-size: 10px; fill: #9db6cf; }
      .layer { fill: rgba(255,255,255,0.03); stroke: rgba(127,228,255,0.18); stroke-dasharray: 4 4; rx: 14; }
    </style>
  </defs>

  <rect width="1100" height="640" fill="url(#bg)"/>
  <text x="550" y="44" text-anchor="middle" class="title">AEGIS-ER · System Architecture</text>
  <text x="550" y="66" text-anchor="middle" class="subtitle">Real-time · Explainable · Disruption-Resilient Dispatch</text>

  <!-- Layer: Inputs -->
  <rect x="40" y="100" width="1020" height="110" class="layer"/>
  <text x="58" y="120" class="subtitle">Ingress</text>

  <!-- Citizens / 999 -->
  <rect x="70" y="140" width="160" height="55" rx="10" fill="#142b47" stroke="#27d6ff" stroke-width="1.5"/>
  <text x="150" y="162" text-anchor="middle" class="boxTitle">📞 Citizen / 999</text>
  <text x="150" y="180" text-anchor="middle" class="boxText">Manual reports · Click-to-report</text>

  <!-- Sim -->
  <rect x="270" y="140" width="170" height="55" rx="10" fill="#142b47" stroke="#ff8c3a" stroke-width="1.5"/>
  <text x="355" y="162" text-anchor="middle" class="boxTitle">🎲 Simulator</text>
  <text x="355" y="180" text-anchor="middle" class="boxText">Synthetic incidents · Chaos events</text>

  <!-- IoT / Sensors -->
  <rect x="480" y="140" width="170" height="55" rx="10" fill="#142b47" stroke="#b57dff" stroke-width="1.5"/>
  <text x="565" y="162" text-anchor="middle" class="boxTitle">📡 Traffic / Weather</text>
  <text x="565" y="180" text-anchor="middle" class="boxText">Roads · Storms · Flood feeds</text>

  <!-- Hospitals -->
  <rect x="690" y="140" width="170" height="55" rx="10" fill="#142b47" stroke="#4f9dff" stroke-width="1.5"/>
  <text x="775" y="162" text-anchor="middle" class="boxTitle">🏥 Hospital Telemetry</text>
  <text x="775" y="180" text-anchor="middle" class="boxText">Bed capacity · Diversions</text>

  <!-- Responders -->
  <rect x="900" y="140" width="130" height="55" rx="10" fill="#142b47" stroke="#7efaff" stroke-width="1.5"/>
  <text x="965" y="162" text-anchor="middle" class="boxTitle">🚑 Responders</text>
  <text x="965" y="180" text-anchor="middle" class="boxText">GPS · Status</text>

  <!-- Layer: API Gateway -->
  <rect x="40" y="250" width="1020" height="80" class="layer"/>
  <text x="58" y="270" class="subtitle">Gateway</text>

  <rect x="410" y="285" width="280" height="40" rx="20" fill="url(#gw)" filter="url(#glow)"/>
  <text x="550" y="311" text-anchor="middle" class="boxTitle">FastAPI API Gateway · REST + WebSocket</text>

  <!-- Layer: Core engine -->
  <rect x="40" y="360" width="1020" height="180" class="layer"/>
  <text x="58" y="380" class="subtitle">Core Engine (libs/aegis)</text>

  <!-- World state -->
  <rect x="70" y="405" width="190" height="110" rx="12" fill="#142b47" stroke="#ffcd3c" stroke-width="1.5"/>
  <text x="165" y="428" text-anchor="middle" class="boxTitle">🗺️ World State</text>
  <text x="165" y="448" text-anchor="middle" class="boxText">Hubs · Units · Incidents</text>
  <text x="165" y="465" text-anchor="middle" class="boxText">Hospitals · EOCs</text>
  <text x="165" y="482" text-anchor="middle" class="boxText">Haversine router</text>
  <text x="165" y="503" text-anchor="middle" class="small">Tick-driven advance() loop</text>

  <!-- Solver -->
  <rect x="300" y="400" width="240" height="120" rx="12" fill="url(#solv)" filter="url(#glow)" opacity="0.92"/>
  <text x="420" y="425" text-anchor="middle" class="boxTitle" fill="#07291d">⚡ Hybrid Solver (200ms)</text>
  <text x="420" y="445" text-anchor="middle" class="boxText" fill="#083325">① Greedy warm-start</text>
  <text x="420" y="462" text-anchor="middle" class="boxText" fill="#083325">② Hungarian bipartite (SciPy)</text>
  <text x="420" y="479" text-anchor="middle" class="boxText" fill="#083325">③ CP-SAT integer program</text>
  <text x="420" y="496" text-anchor="middle" class="boxText" fill="#083325">④ Large Neighborhood Search</text>
  <text x="420" y="512" text-anchor="middle" class="small" fill="#062119">Stale-progress purge · Dedup · Failover</text>

  <!-- Explain -->
  <rect x="580" y="405" width="190" height="110" rx="12" fill="#142b47" stroke="#3ef0a5" stroke-width="1.5"/>
  <text x="675" y="428" text-anchor="middle" class="boxTitle">🧠 Explain / Priority</text>
  <text x="675" y="448" text-anchor="middle" class="boxText">Urgency scoring</text>
  <text x="675" y="465" text-anchor="middle" class="boxText">Confidence ring</text>
  <text x="675" y="482" text-anchor="middle" class="boxText">Rationale bullets</text>
  <text x="675" y="503" text-anchor="middle" class="small">Auditable decision trail</text>

  <!-- Dispatch Queue -->
  <rect x="810" y="405" width="220" height="110" rx="12" fill="#142b47" stroke="#ff4560" stroke-width="1.5"/>
  <text x="920" y="428" text-anchor="middle" class="boxTitle">📋 Dispatch Queue</text>
  <text x="920" y="448" text-anchor="middle" class="boxText">State machine:</text>
  <text x="920" y="465" text-anchor="middle" class="boxText">PROPOSED → EN_ROUTE → ON_SCENE</text>
  <text x="920" y="482" text-anchor="middle" class="boxText">→ TRANSPORTING → COMPLETED</text>
  <text x="920" y="503" text-anchor="middle" class="small">Re-route · Divert · Failover</text>

  <!-- Layer: Outputs -->
  <rect x="40" y="565" width="1020" height="60" class="layer"/>
  <text x="58" y="583" class="subtitle">Clients &amp; Observability</text>

  <rect x="130" y="573" width="180" height="40" rx="10" fill="url(#ws)" filter="url(#glow)"/>
  <text x="220" y="598" text-anchor="middle" class="boxTitle">🖥️ Command Dashboard</text>

  <rect x="340" y="573" width="180" height="40" rx="10" fill="url(#ws)" filter="url(#glow)"/>
  <text x="430" y="598" text-anchor="middle" class="boxTitle">📱 Responder Devices</text>

  <rect x="550" y="573" width="180" height="40" rx="10" fill="url(#ws)"/>
  <text x="640" y="598" text-anchor="middle" class="boxTitle">🏢 EOC Workstations</text>

  <rect x="760" y="573" width="180" height="40" rx="10" fill="url(#db)"/>
  <text x="850" y="598" text-anchor="middle" class="boxTitle" fill="#2b1a00">📜 Event Log · Audit</text>

  <!-- Arrows: inputs -> gateway -->
  <g stroke="#7fe4ff" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M150,195 L150,280 Q150,285 410,305"/>
    <path d="M355,195 L355,280 Q355,285 430,305"/>
    <path d="M565,195 L565,285"/>
    <path d="M775,195 L775,280 Q775,285 660,305"/>
    <path d="M965,195 L965,280 Q965,285 690,305"/>
  </g>
  <!-- Gateway to core -->
  <g stroke="#7fe4ff" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M490,325 L220,400"/>
    <path d="M520,325 L410,395"/>
    <path d="M580,325 L660,400"/>
    <path d="M620,325 L850,400"/>
  </g>
  <!-- Core cross wiring -->
  <g stroke="#7fe4ff" stroke-width="1" fill="none" marker-end="url(#arrow)" opacity="0.7">
    <path d="M260,460 L298,460"/>
    <path d="M540,460 L578,460"/>
    <path d="M770,460 L808,460"/>
  </g>
  <!-- Core to outputs -->
  <g stroke="#7fe4ff" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M220,515 Q220,550 220,570"/>
    <path d="M430,520 Q430,550 430,570"/>
    <path d="M675,515 Q640,550 640,570"/>
    <path d="M900,515 Q880,550 850,570"/>
  </g>
</svg>
